services:
  runtime-pc:
    image: lwir-runtime-pc:dxas-5749ab70-ubuntu22.04
    build:
      context: .
      dockerfile: docker/runtime-pc/Dockerfile
      args:
        DX_RUNTIME_IMAGE: ${DX_RUNTIME_IMAGE:-dx-runtime:dxas-5749ab70-ubuntu22.04}

    volumes:
      - .:/workspace/lwir-runtime
      - runtime-build:/workspace/lwir-runtime/build

    working_dir: /workspace/lwir-runtime

    entrypoint: /bin/bash

    stdin_open: true
    tty: true

volumes:
  runtime-build:
