# ============================================================
# 1. 로그 설정
# ============================================================

logging:
  level: info


# ============================================================
# 2. 촬영 데이터 저장 경로
# ============================================================

dataset:
  # 현재 workspace 기준 상대경로
  root: /mnt/lwir_data/datasets


# ============================================================
# 3. 촬영 Sequence
# ============================================================

sequence:
  id: seq_001


# ============================================================
# 4. 실험 조건
# ============================================================

condition:
  # 카메라와 대상 사이의 거리 [m] 
  # 예시 : (20, 40, 60, 80, 100 ....)
  distance_m: 30

  # 촬영 대상 인원 수 
  # 예시 : (1, 2, 3, 4, ....)
  person_count: 3

  # 움직임 조건
  # 예시 : crossing, normal 
  motion: crossing

  # 촬영 당시 외기 온도 [°C]
  temperature_c: 18.5