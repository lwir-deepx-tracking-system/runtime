model:
  name: yolo26s
  path: models/yolo26s_finetuned.dxnn

camera_input:
  opencv_type: CV_16UC1
  width: 640
  height: 480
  clip_min: 0
  clip_max: 65535
  channel_mode: replicate_gray_to_rgb

input:
  width: 640
  height: 640

preprocess:
  type: lwir_letterbox
  resize: letterbox
  normalize: false
  pad_value: 114

postprocess:
  type: yolo26
  # YOLO26 export에 따라 [1, N, 6], [1, 4+C, N], split-head를 구분한다.
  output_format: auto
  split_output_levels: 3
  # 표준 YOLO26은 reg_max=1인 DFL-free regression을 사용한다.
  split_regression_bins: 1
  # use_ort=false에서 반환되는 cv3 Conv output은 Sigmoid 전 class logit이다.
  split_class_score_activation: sigmoid
  # end-to-end output은 NMS를 생략하고 raw/split output에는 적용한다.
  nms_mode: auto
  class_agnostic_nms: true
  confidence_threshold: 0.01
  nms_threshold: 0.45
  num_classes: 16
  class_names: [ "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat"]

#"dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange", "brocolli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush" ]
