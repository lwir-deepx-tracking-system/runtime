# ============================================================
# 1. 로그 설정
# ============================================================

logging:
  # lwir_benchmark 실행 중 출력할 로그 레벨
  level: info


# ============================================================
# 2. Detection / ReID 설정
# ============================================================

detection:
  # 사용할 모델 설정 파일
  config: config/detection/yolo26s.yaml
  inference:
    # 프레임별 latency 측정을 위해 한 번에 하나씩 처리한다.
    max_inflight: 1
    # DXRT 내부 입력·출력 buffer 수. 0이면 자동 설정
    buffer_count: 6
    use_ort: false
    # Detection과 ReID가 서로 다른 NPU core를 사용하도록 지정한다.
    npu_cores: 0

reid:
  enabled: true
  config: config/reid/repvgg.yaml
  matcher_config: config/reid/matcher.yaml
  inference:
    # ReID crop은 현재 동기 추론한다.
    max_inflight: 1
    buffer_count: 0
    use_ort: false
    npu_cores: 1
  person_class_id: 0
  min_crop_height: 32
  max_crops_per_frame: 2


# ============================================================
# 3. Tracking
# ============================================================

tracking:
  id: 1

tracking_catalog:
  - id: 1
    config: config/tracking/bytetrack.yaml
  - id: 2
    config: config/tracking/botsort.yaml
  - id: 3
    config: config/tracking/bytetrack_post_reid.yaml


# ============================================================
# 4. Benchmark Sequence 범위
# ============================================================

sequence:
  # false이면 dataset_root 아래의 모든 Sequence를 처리한다.
  # true이면 start부터 end까지 양끝을 포함하여 처리한다.
  range_enabled: true

  # 숫자 순서와 문자열 정렬 순서가 같도록 seq_001 형식의 zero-padding을 사용한다.
  start: seq_001
  end: seq_001


# ============================================================
# 5. Benchmark 경로
# ============================================================

path:
  # lwir_capture가 생성한 Sequence들이 저장된 경로
  dataset_root: /mnt/lwir_data/datasets

  # Detection / Tracking 결과를 저장할 경로
  output_root: /mnt/lwir_data/results/benchmark
