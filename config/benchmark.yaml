# ============================================================
# 1. 로그 설정
# ============================================================

logging:
  # lwir_benchmark 실행 중 출력할 로그 레벨
  level: info


# ============================================================
# 2. 모델 설정
# ============================================================

model:
  # 사용할 모델 설정 파일
  config: config/model/yolov8n.yaml


# ============================================================
# 3. Detection 설정
# ============================================================

detection:
  # 동시에 처리할 수 있는 최대 inference 요청 수
  # benchmark는 순차 처리 기준으로 우선 1 사용
  max_inflight: 1


# ============================================================
# 4. Tracking - ByteTrack
# ============================================================

tracking:
  # Track으로 사용할 Detection confidence 기준
  track_threshold: 0.5

  # ByteTrack 매칭 기준
  match_threshold: 0.8

  # Detection이 일시적으로 사라졌을 때 Track을 유지할 프레임 수
  track_buffer: 30

  # ----------------------------------------------------------
  # 선택 설정
  # 아래 키는 생략할 수 있으며, 생략하면 기능이 꺼진다 (괄호 안이 기본값).
  # ----------------------------------------------------------

  # 1차 매칭과 미확정 Track 매칭 비용에 검출 점수를 곱한다 (비용 = 1 - IoU × 점수)
  # fuse_score: false

  # 놓친 Track을 Kalman 예측 위치로 이 프레임 수만큼 더 출력한다 (0: 출력 안 함)
  # 출력된 박스는 검출이 아니라 예측이다
  # lost_output_frames: 0

  # Buffered IoU: 1차 매칭 뒤 남은 Track과 검출을 박스를 넓혀 한 번 더 매칭한다
  # 빠르거나 작은 표적용이다. 넓힌 박스는 매칭 판단에만 쓰고 출력 박스에는 쓰지 않는다
  # buffer_scale: 0.0       # 각 변을 폭·높이의 이 비율만큼 넓힘 (0: 끔, 0 이상 2 이하)
  # buffer_max_px: 0        # 한 변을 넓히는 최대 px (0: 제한 없음)
  # buffer_small_size: 0    # Track 박스의 짧은 변이 이 px 이하일 때만 적용 (0: 크기 무관)
  # buffer_snap: false      # 넓힌 박스로 맞은 Track의 위치를 검출 박스로 맞춤
  

# ============================================================
# 5. Benchmark 경로
# ============================================================

path:
  # lwir_capture가 생성한 Sequence들이 저장된 경로
  dataset_root: /mnt/lwir_data/datasets

  # Detection / Tracking 결과를 저장할 경로
  output_root: /mnt/lwir_data/results/benchmark