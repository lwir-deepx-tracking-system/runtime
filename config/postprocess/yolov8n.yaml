# YOLOv8n 출력 텐서를 검출 결과로 변환하는 후처리 계약.
postprocess:
  type: yolov8
  # auto: DXRT output shape를 검증해 decoded_xywh 또는 split_head를 선택한다.
  output_format: auto
  split_output_levels: 3
  split_regression_bins: 16
  split_class_score_activation: sigmoid
  nms_mode: enabled
  class_agnostic_nms: true
  confidence_threshold: 0.01
  nms_threshold: 0.45
  num_classes: 80
  class_names: [ "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange", "brocolli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush" ]
