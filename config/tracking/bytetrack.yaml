# ByteTrack 설정. ByteTrackTracker가 시작할 때 읽고 검증한다.
# 모르는 키(오타 포함)나 범위를 벗어난 값이 있으면 프로그램이 시작되지 않는다.

# [필수] 이 점수 이상인 검출은 high detection (1차 매칭, 새 Track 후보)
track_threshold: 0.5
# [필수] 1차 매칭 허용 거리 (1 - IoU). 0.8이면 IoU 0.2 이상이어야 같은 물체로 본다
match_threshold: 0.8
# [필수] 놓친 Track을 기억하는 프레임 수 (frame_rate 30 기준, 30이면 1초)
track_buffer: 30

# [선택] 아래 값은 없으면 기본값을 쓴다.
# low_threshold: 0.1          # 이 점수 초과 ~ track_threshold 미만은 2차 매칭에만 사용
# new_track_threshold: 0.6    # 새 ID를 만드는 최소 점수 (기본: track_threshold + 0.1)
# frame_rate: 30              # 실제 처리 fps. track_buffer를 이 비율로 환산한다
