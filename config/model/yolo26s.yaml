model:
  name: yolo26s
  path: models/yolo26s_finetuned.dxnn

camera_input:
  opencv_type: CV_16UC1
  width: 640
  height: 480
  clip_min: 0
  clip_max: 65535
  channel_mode: replicate_gray_to_rgb

input:
  width: 640
  height: 640

preprocess:
  type: lwir_letterbox
  resize: letterbox
  normalize: false
  pad_value: 114
