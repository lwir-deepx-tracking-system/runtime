# Resource paths below are relative to this YAML directory plus path_base.
path_base: ..

# ============================================================
# 1. Runtime / Logging
# ============================================================

logging:
  level: debug

measurement:
  enabled: true
  output_root: /mnt/lwir_data/results/runtime


# ============================================================
# 2. Detection / ReID
# ============================================================

# 모델에 종속적인 설정은 별도 YAML에서 관리한다.
# - model path
# - camera input format
# - model input size
# - preprocess
# - postprocess
detection:
  config: config/detection/yolov8n.yaml
  inference:
    # 동시에 처리할 수 있는 최대 검출 요청 수
    max_inflight: 4
    # DXRT 내부 입력·출력 buffer 수. 0이면 자동 설정
    buffer_count: 6
    # false이면 ONNX Runtime CPU fallback을 사용하지 않는다.
    use_ort: false
    npu_cores: all

reid:
  config: config/reid/repvgg.yaml
  matcher_config: config/reid/matcher.yaml
  min_crop_height: 32
  max_crops_per_frame: 2
  inference:
    # Tracker가 선택되면 해당 구성 객체가 ReID 추론을 수행한다.
    max_inflight: 1
    buffer_count: 0
    use_ort: false
    npu_cores: all

# Runtime catalog names are sent to the single LAN-connected PC over TCP.
detection_catalog:
  - id: 1
    name: YOLOv8n
    config: config/detection/yolov8n.yaml
  - id: 2
    name: YOLO26s
    config: config/detection/yolo26s.yaml
  - {id: 3, name: 'YOLO26m FLIR 640x480', config: config/detection/newmrw480.yaml}
  - {id: 4, name: 'YOLO26s 640x480', config: config/detection/s480.yaml}
  - {id: 5, name: 'YOLO26m FLIR 640x640', config: config/detection/m640.yaml}
  - {id: 6, name: 'YOLO26s 640x640', config: config/detection/s6.yaml}
  - {id: 7, name: 'YOLO26m inside 20261110 1742', config: config/detection/yolo26m_inside_1742.yaml}
  - {id: 8, name: 'YOLO26m inside 20261110 2020', config: config/detection/yolo26m_inside_2020.yaml}
  - {id: 9, name: 'YOLO26m inside patch 20261111', config: config/detection/yolo26m_inside_patch.yaml}
  - {id: 10, name: 'YOLO26m outside patch 20261110', config: config/detection/yolo26m_outside_patch.yaml}
  - {id: 11, name: 'YOLO26s NMS-free 640x640', config: config/detection/yolo26s_nmsfree.yaml}


# ============================================================
# 3. Tracking
# ============================================================

tracking:
  id: 1

tracking_catalog:
  - id: 1
    name: ByteTrack
    config: config/tracking/bytetrack.yaml
  - id: 2
    name: BoT-SORT + Appearance ReID
    config: config/tracking/botsort.yaml
  - id: 3
    name: ByteTrack + Post-ReID
    config: config/tracking/bytetrack_post_reid.yaml
  - id: 4
    name: ByteTrack + Filters + GMC + Post-ReID
    config: config/tracking/bytetrack_filtered.yaml
  - id: 5
    name: OC-SORT
    config: config/tracking/ocsort.yaml
  - id: 6
    name: SORT
    config: config/tracking/sort.yaml


# ============================================================
# 4. Target / Control
# ============================================================

control:
  enabled: true

  auto:
    # 흔들림 완화를 위해 P 제어로 기준을 잡고 실기에서 축별 kp를 조정한다.
    controller: p          # p / pi / pd / pid
    pid_x: {kp: 35.0, ki: 0.0, kd: 0.0}
    pid_y: {kp: 35.0, ki: 0.0, kd: 0.0}
    deadband_x: 0.06
    deadband_y: 0.06
    speed_max: 70          # AUTO 전용 상한
    speed_rate: 100.0       # SPD/초. STOP은 제한 우회

  gimbal:
    device: /dev/ttyUSB0
    speed: 30              # 수동 방향키 고정 속도. AUTO 상한과 독립

# ============================================================
# 5. GUI Communication
# ============================================================

gui:
  enabled: true

  # ----------------------------------------------------------
  # 6-1. Video
  # Orange Pi -> GUI
  # JPEG or H.264 / RTP / UDP
  # ----------------------------------------------------------

  video:
    host: 192.168.50.1
    port: 5000

    # JPEG : jpegenc / mppjpegenc
    # H.264 : x264enc / mpph264enc

    codec: h264
    encoder: mpph264enc

    bitrate_kbps: 3000
    jpeg_quality: 80
    keyframe_interval: 30
    fps: 30
    rtp_mtu: 1200

  # ----------------------------------------------------------
  # 6-2. Tracking Metadata
  # Orange Pi -> GUI
  # frame_id / track_id / bbox 등을 UDP로 전송
  # ----------------------------------------------------------

  metadata:
    enabled: true

    host: 192.168.50.1
    port: 5001

    max_packet_bytes: 1200

  # ----------------------------------------------------------
  # 6-3. GUI Command
  # GUI -> Orange Pi
  # PC 명령 수신 및 ACK/STATUS 응답
  # ----------------------------------------------------------

  command:
    handler: tracking  # tracking: AUTO+수동 / deferred: 통신 시험만
    enabled: true

    bind_address: 192.168.50.2
    port: 5002

    receive_timeout_ms: 1000
