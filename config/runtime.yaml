# ============================================================
# 1. Runtime / Logging
# ============================================================

logging:
  level: debug

measurement:
  enabled: true
  output_root: /mnt/lwir_data/results/runtime


# ============================================================
# 2. Model
# ============================================================

# 모델에 종속적인 설정은 별도 YAML에서 관리한다.
# - model path
# - camera input format
# - model input size
# - preprocess
# - postprocess
model:
  config: config/model/yolov8n.yaml

# Internal model catalog. The PC wire protocol does not define model selection.
model_catalog:
  - id: 1
    config: config/model/yolov8n.yaml
  - id: 2
    config: config/model/yolo26s.yaml


# ============================================================
# 3. Detection
# ============================================================

detection:
  # 동시에 처리할 수 있는 최대 inference 요청 수
  max_inflight: 4

  # DXRT 내부 입력·출력 buffer 수. 0이면 DXRT가 자동으로 결정한다.
  buffer_count: 6

  # false이면 ONNX Runtime CPU fallback을 사용하지 않는다.
  use_ort: false


# ============================================================
# 4. Tracking
# ============================================================

tracking:
  id: 1

tracking_catalog:
  - id: 1
    config: config/tracking/bytetrack.yaml


# ============================================================
# 5. Target / Control
# ============================================================

control:
  # AUTO와 수동 조작 모두 handler=tracking에서 처리. 실제 구동은 enabled=true 필요.
  enabled: true
  heartbeat_timeout_ms: 1500  # 마지막 유효 PING 이후 수동 이동을 정지할 시간
  poll_interval_ms: 25       # 프레임과 독립적인 명령·heartbeat 확인 주기
  # 실기 튜닝 전 임시값. SPD는 장치 명령 단위이며 각속도가 아니다.
  auto:
    kp: 30.0
    deadband_x: 0.04
    deadband_y: 0.04
    fov_x_deg: 0.0           # 두 값이 0이면 정규화 픽셀 오차; FOV 사용 시 Deadband 단위 rad
    fov_y_deg: 0.0
    min_confidence: 0.5
    speed_min: 1
    speed_max: 30           # gimbal.speed 이하
    speed_rate: 60.0        # SPD/초. 안전 STOP은 제한 우회
    period_ms: 25
    input_timeout_ms: 250   # 캡처 시각 기준; 프레임 중단 시에도 STOP
    reacquire_timeout_ms: 1000 # 상실 대기 시작 후 제한 시간. 만료 시 MANUAL/선택 해제
  gimbal:
    device: /dev/ttyUSB0     # 실기에서는 /dev/serial/by-id/... 고정 경로 권장
    baud_rate: 115200
    write_timeout_ms: 100
    speed: 30
    acceleration: 50
    home_x_deg: 0            # HOME 실행·완료 피드백은 이번 범위에서 제외
    home_y_deg: 0
    x_sign: 1               # 축 방향 반전이 필요하면 -1
    y_sign: 1


# ============================================================
# 6. GUI Communication
# ============================================================

gui:
  enabled: true

  # ----------------------------------------------------------
  # 6-1. Video
  # Orange Pi -> GUI
  # JPEG or H.264 / RTP / UDP
  # ----------------------------------------------------------

  video:
    host: 192.168.50.1
    port: 5000

    # JPEG : jpegenc / mppjpegenc
    # H.264 : x264enc / mpph264enc

    codec: h264
    encoder: mpph264enc

    bitrate_kbps: 3000
    jpeg_quality: 80
    keyframe_interval: 30
    fps: 30
    rtp_mtu: 1200

  # ----------------------------------------------------------
  # 6-2. Tracking Metadata
  # Orange Pi -> GUI
  # frame_id / track_id / bbox 등을 UDP로 전송
  # ----------------------------------------------------------

  metadata:
    enabled: true

    host: 192.168.50.1
    port: 5001

    max_packet_bytes: 1200

  # ----------------------------------------------------------
  # 6-3. GUI Command
  # GUI -> Orange Pi
  # PC 명령 수신 및 ACK/STATUS 응답
  # ----------------------------------------------------------

  command:
    handler: tracking  # tracking: AUTO+수동 / deferred: 통신 시험만
    enabled: true

    bind_address: 192.168.50.2
    port: 5002

    receive_timeout_ms: 1000
